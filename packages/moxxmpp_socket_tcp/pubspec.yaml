version: 0.4.0
homepage: https://codeberg.org/moxxy/moxxmpp
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  logging: ^1.0.2
  meta: ^1.6.0
  moxxmpp:
    path: ../moxxmpp

dev_dependencies:
  lints: ^2.0.0
  test: ^1.16.0
  very_good_analysis: ^3.0.1
